version: 2

models:
  - name: stg_stocks
    description: Cleaned and standardised raw S&P 500 stock price data. One row per company per trading day.
    columns:
      - name: date
        description: The trading date
        tests:
          - not_null
      - name: ticker
        description: The stock ticker symbol e.g. AAPL, GOOGL
        tests:
          - not_null
      - name: open_price
        description: The opening price of the stock on this date
      - name: high_price
        description: The highest price of the stock on this date
      - name: low_price
        description: The lowest price of the stock on this date
      - name: close_price
        description: The closing price of the stock on this date
      - name: volume
        description: The number of shares traded on this date

  - name: dim_companies
    description: Dimension table containing one row per unique ticker symbol.
    columns:
      - name: ticker
        description: Unique stock ticker symbol — primary key
        tests:
          - not_null
          - unique
      - name: company_name
        description: Company name derived from ticker symbol

  - name: dim_dates
    description: Dimension table containing one row per unique trading date with calendar attributes.
    columns:
      - name: date
        description: Unique trading date — primary key
        tests:
          - not_null
          - unique
      - name: year
        description: Calendar year
      - name: month
        description: Calendar month (1-12)
      - name: quarter
        description: Calendar quarter (1-4)
      - name: day_of_week
        description: Day of week (0=Sunday, 6=Saturday)

  - name: fct_daily_prices
    description: Fact table with daily stock prices and calculated daily returns using LAG window function.
    columns:
      - name: date
        description: The trading date
        tests:
          - not_null
      - name: ticker
        description: The stock ticker symbol
        tests:
          - not_null
      - name: open_price
        description: Opening price
      - name: high_price
        description: Daily high price
      - name: low_price
        description: Daily low price
      - name: close_price
        description: Closing price
      - name: volume
        description: Shares traded
      - name: daily_price_change
        description: Difference between today's close and yesterday's close for the same ticker
      - name: daily_return_pct
        description: Percentage daily return calculated as (close - prev_close) / prev_close * 100
